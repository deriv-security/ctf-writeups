services:
  proto:
    image: ctf:proto
    build: .
    ports:
      - 3000
    environment:
      - NODE_ENV=production
      - FLAG=flag{placeholder}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail http://localhost:3000/" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
